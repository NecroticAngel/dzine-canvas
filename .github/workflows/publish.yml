name: Publish image and Helm chart

on:
  push:
    tags: ['v*', 'qa*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: release
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            {
              echo "version=${BASH_REMATCH[1]}"
              echo "image-tags=ghcr.io/necroticangel/dzine-canvas:${BASH_REMATCH[1]},ghcr.io/necroticangel/dzine-canvas:latest"
              echo "chart-version=${BASH_REMATCH[1]}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^qa([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            {
              echo "version=${tag}"
              echo "image-tags=ghcr.io/necroticangel/dzine-canvas:${tag}"
              echo "chart-version=${BASH_REMATCH[1]}-qa"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported tag: $tag" >&2
            exit 1
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image-tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Package and publish Helm chart
        env:
          CHART_VERSION: ${{ steps.release.outputs.chart-version }}
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          helm lint infra/helm/dzine-canvas
          helm package infra/helm/dzine-canvas --version "$CHART_VERSION" --app-version "$APP_VERSION" --destination /tmp
          echo "${{ github.token }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "/tmp/dzine-canvas-${CHART_VERSION}.tgz" oci://ghcr.io/necroticangel/helm-charts
