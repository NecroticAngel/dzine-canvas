name: Publish image and Helm chart

on:
  push:
    tags: ['v*', 'qa*']
  workflow_call:
    inputs:
      release-tag:
        description: Tag to build and publish
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.ref }}
      - id: release
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.release-tag || github.ref_name }}"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            {
              echo "version=${BASH_REMATCH[1]}"
              echo "image-tags=ghcr.io/necroticangel/dzine-canvas:${BASH_REMATCH[1]},ghcr.io/necroticangel/dzine-canvas:latest"
              echo "chart-version=${BASH_REMATCH[1]}"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^qa([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            {
              echo "version=${tag}"
              echo "image-tags=ghcr.io/necroticangel/dzine-canvas:${tag}"
              echo "chart-version=${BASH_REMATCH[1]}-qa"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported tag: $tag" >&2
            exit 1
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image-tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package and publish Helm chart
        env:
          CHART_VERSION: ${{ steps.release.outputs.chart-version }}
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          helm lint infra/helm/dzine-canvas
          helm package infra/helm/dzine-canvas --version "$CHART_VERSION" --app-version "$APP_VERSION" --destination /tmp
          echo "${{ github.token }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "/tmp/dzine-canvas-${CHART_VERSION}.tgz" oci://ghcr.io/necroticangel/helm-charts
