name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      # color-picker/draw have not published v2 peer metadata, while the app
      # uses the design-core v2 API. Keep the existing compatibility contract.
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint infra/helm/dzine-canvas
      - run: helm template demo infra/helm/dzine-canvas >/tmp/dzine-canvas.yaml
      - run: docker build --tag dzine-canvas:ci .
      - run: node scripts/check-container.mjs dzine-canvas:ci
