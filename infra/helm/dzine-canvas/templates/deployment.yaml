apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dzine-canvas.fullname" . }}
  labels: {{- include "dzine-canvas.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "dzine-canvas.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dzine-canvas.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: canvas
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # One storage root, and the per-tenant layout follows from it:
            #   /data/templates            shared templates
            #   /data/users/{tenant}/designs
            #   /data/users/{tenant}/uploads
            # This used to set DESIGNS_DIR=/data/designs with no {userId}, which
            # gave every tenant the same directory, and left UPLOADS_DIR unset
            # so uploads landed in the container and vanished on redeploy.
            - name: BASE_PATH
              value: {{ .Values.basePath | quote }}
            - name: STORAGE_ROOT
              value: /data
            - name: TRUST_PROXY
              value: {{ .Values.trustProxy | quote }}
          ports:
            - name: http
              containerPort: 4201
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.existingClaim }}
